<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Wait for the other data owner connected to the enclave to complete Step 5">
  <rect x="0.5" y="0.5" width="759" height="279" rx="6" fill="#fefefe" stroke="#e8eaed"/>

  <!-- person -->
  <g>
    <!-- torso -->
    <path d="M78 245 L78 190 a47 47 0 0 1 47 -47 a47 47 0 0 1 47 47 L172 245 Z" fill="#4b87d1"/>
    <!-- raised arm -->
