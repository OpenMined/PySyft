  <rect x="241" y="44" width="496" height="188" rx="14" fill="#eaeff7" stroke="#ccd8e8" stroke-width="2"/>
  <rect x="243" y="120" width="4" height="36" fill="#eaeff7"/>

  <g fill="#2c3e50" font-family="'DejaVu Sans','Open Sans',Verdana,sans-serif" font-size="27" font-weight="bold" text-anchor="middle">
    <text x="489" y="103">Wait for the other data owner</text>
    <text x="489" y="142">connected to the enclave</text>
    <text x="489" y="181">to complete Step 5</text>
  </g>
