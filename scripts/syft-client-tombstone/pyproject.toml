[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syft-client"
version = "0.2.0"
description = "DEPRECATED: syft-client has been renamed to syft. Install 'syft' instead."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenMined", email = "info@openmined.org"}
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]
# Pulls in the real package so `pip install syft-client` still yields a working
# `import syft`; only the old `syft_client` import name is gone.
dependencies = ["syft>=0.10.0"]

[project.urls]
Homepage = "https://github.com/OpenMined/PySyft"
Repository = "https://github.com/OpenMined/PySyft"

[tool.setuptools]
packages = ["syft_client"]

# Make this directory its own (empty) uv workspace root so `uv build` run from
# here does not try to attach to the monorepo workspace two levels up.
[tool.uv.workspace]
