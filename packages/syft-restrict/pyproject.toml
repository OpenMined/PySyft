[project]
name = "syft-restrict"
version = "0.1.0"
description = "Verify + obfuscate: prove JAX/Flax inference code only does math (no data theft) while hiding the model architecture"
authors = [{ name = "OpenMined", email = "info@openmined.org" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"

# Static analysis on the stdlib (ast, tokenize, hashlib, fnmatch); pydantic models the results.
dependencies = ["pydantic>=2"]

# Console script for the catalog linter, so authors can lint their own catalog after install
# (e.g. `uv run syft-restrict-lint path/to/catalog --fix`) without a source-tree path.
[project.scripts]
syft-restrict-lint = "syft_restrict.catalog_lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syft_restrict"]
