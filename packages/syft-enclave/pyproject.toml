[project]
name = "syft-enclave"
version = "0.1.0"
description = "TEE attestation server for syft"
authors = [{ name = "OpenMined", email = "info@openmined.org" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "syft>=0.10.0",  # floor: the `syft` PyPI project also hosts legacy PySyft <=0.9
    "syft-rds>=0.6.0",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.0",
    "google-auth[pyjwt]>=2.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
"syft" = { workspace = true }
"syft-rds" = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/syft_enclaves"]

