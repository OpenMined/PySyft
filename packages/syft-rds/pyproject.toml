[project]
name = "syft-rds"
version = "0.6.0"
description = "PySyft 0.10+ Remote Data Science client: datasets + jobs on top of the syft sync engine (SyftBox users of the earlier syft-rds 0.x should pin syft-rds<0.6)"
readme = "README.md"
authors = [{ name = "OpenMined", email = "info@openmined.org" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "syft>=0.10.0",  # floor: the `syft` PyPI project also hosts legacy PySyft <=0.9
    "syft-job",
    "syft-dataset==0.1.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
"syft" = { workspace = true }
"syft-job" = { workspace = true }
"syft-dataset" = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/syft_rds"]
