name: CD - Syft RDS

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  workflow_call:
    inputs:
      bump_type:
        type: string
        required: true

concurrency:
  group: 'CD - Syft RDS'
  cancel-in-progress: false

jobs:
  deploy-syft-rds:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC)
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The branch already holds the version to release. The bump happens after
      # the publish, so the version on the branch always names an unreleased
      # version while people develop.
      - name: Read the version to release
        run: |
          git pull
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/syft-rds/pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Releasing syft-rds $VERSION"

      - name: Build package
        working-directory: packages/syft-rds
        run: uv build --out-dir dist

      # attestations: PEP 740 attestations are generated by default, but their
      # Sigstore certificate names the *top-level* workflow (cd-monorepo.yml when
      # called from the monorepo release), while PyPI's publisher must be the
      # reusable file (cd-syft-rds.yml) for the OIDC exchange to succeed. PyPI
      # rejects that mismatch with "Invalid attestations supplied", so upload
      # without attestations (same as the token-based sub-package workflows).
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/syft-rds/dist
          attestations: false
          verbose: true

      # The tag must name the published version, so it is created before the bump.
      # The tag is annotated and pushed explicitly: `--follow-tags` only pushes
      # annotated tags, so a lightweight tag would never reach origin.
      - name: Tag the release, then bump for the next one
        run: |
          git tag -a "syft-rds/v${{ env.VERSION }}" -m "syft-rds v${{ env.VERSION }}"
          pip install packaging
          OUTPUT=$(python scripts/bump_version.py syft-rds ${{ inputs.bump_type }} --dependents published)
          NEXT=$(echo "$OUTPUT" | sed -n '1p')
          MODIFIED=$(echo "$OUTPUT" | sed -n '2p')
          git add $MODIFIED
          git commit -m "Bump syft-rds to $NEXT for the next release"
          git push origin HEAD
          git push origin "refs/tags/syft-rds/v${{ env.VERSION }}"
