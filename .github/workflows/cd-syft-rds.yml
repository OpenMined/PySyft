name: CD - Syft RDS

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  workflow_call:
    inputs:
      bump_type:
        type: string
        required: true

concurrency:
  group: 'CD - Syft RDS'
  cancel-in-progress: false

jobs:
  deploy-syft-rds:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC)
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          git pull
          pip install packaging
          OUTPUT=$(python scripts/bump_version.py syft-rds ${{ inputs.bump_type }})
          VERSION=$(echo "$OUTPUT" | sed -n '1p')
          MODIFIED=$(echo "$OUTPUT" | sed -n '2p')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MODIFIED=$MODIFIED" >> $GITHUB_ENV
          echo "Bumped syft-rds to $VERSION (modified: $MODIFIED)"

      - name: Build package
        working-directory: packages/syft-rds
        run: uv build --out-dir dist

      # attestations: PEP 740 attestations are generated by default, but their
      # Sigstore certificate names the *top-level* workflow (cd-monorepo.yml when
      # called from the monorepo release), while PyPI's publisher must be the
      # reusable file (cd-syft-rds.yml) for the OIDC exchange to succeed. PyPI
      # rejects that mismatch with "Invalid attestations supplied", so upload
      # without attestations (same as the token-based sub-package workflows).
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/syft-rds/dist
          attestations: false
          verbose: true

      # Annotated tag + explicit push: `--follow-tags` only pushes annotated
      # tags, so a lightweight tag would never reach origin.
      - name: Commit and tag
        run: |
          git add ${{ env.MODIFIED }}
          git commit -m "Release syft-rds v${{ env.VERSION }}"
          git tag -a "syft-rds/v${{ env.VERSION }}" -m "syft-rds v${{ env.VERSION }}"
          git push origin HEAD
          git push origin "refs/tags/syft-rds/v${{ env.VERSION }}"
