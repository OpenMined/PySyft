name: CD - Monorepo

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run pre-release tests
        type: boolean
        default: true

      bump_type:
        description: Version bump type
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

      release_syft_permissions:
        description: Release syft-permissions
        type: boolean
        default: true

      release_syft_perms:
        description: Release syft-perms
        type: boolean
        default: true

      release_syft_migration:
        description: Release syft-migration
        type: boolean
        default: true

      release_syft_job:
        description: Release syft-job
        type: boolean
        default: true

      release_syft_dataset:
        description: Release syft-dataset
        type: boolean
        default: true

      release_syft_rds:
        description: Release syft-rds
        type: boolean
        default: true

      release_syft_enclave:
        description: Release syft-enclave
        type: boolean
        default: true

      release_syft_bg:
        description: Release syft-bg
        type: boolean
        default: true

concurrency:
  group: 'CD - Monorepo'
  cancel-in-progress: false

jobs:
  call-linting-tests:
    if: inputs.run_tests == true
    uses: OpenMined/PySyft/.github/workflows/ci.yml@dev

  call-unit-tests:
    if: inputs.run_tests == true
    uses: OpenMined/PySyft/.github/workflows/unit-tests.yml@dev

  call-integration-tests:
    if: inputs.run_tests == true
    uses: OpenMined/PySyft/.github/workflows/integration-tests.yml@dev
    secrets: inherit

  # Release order follows the dependency graph:
  # 1. syft-permissions (no internal deps)
  # 2. syft-perms (depends on syft-permissions)
  # 3. syft-migration (no internal deps; needed by dataset + job)
  # 4. syft-dataset, then syft-job (depend on syft-perms + syft-migration)
  # 5. syft-rds (depends on syft, syft-job, syft-dataset)
  # 6. syft-enclave + syft-bg (depend on syft-rds) — parallel
  # 7. syft (root; its pins were rewritten by the jobs above)

  release-syft-permissions:
    needs: [call-linting-tests, call-unit-tests, call-integration-tests]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_permissions == true
    uses: ./.github/workflows/cd-syft-permissions.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-perms:
    needs: [release-syft-permissions]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_perms == true
    uses: ./.github/workflows/cd-syft-perms.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-migration:
    needs: [release-syft-perms]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_migration == true
    uses: ./.github/workflows/cd-syft-migration.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-dataset:
    needs: [release-syft-migration]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_dataset == true
    uses: ./.github/workflows/cd-syft-dataset.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-job:
    needs: [release-syft-dataset]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_job == true
    uses: ./.github/workflows/cd-syft-job.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-rds:
    needs: [release-syft-job]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_rds == true
    # A called workflow cannot exceed the caller's token permissions, so the
    # OIDC permission for trusted publishing has to be granted here as well.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/cd-syft-rds.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-enclave:
    needs: [release-syft-rds]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_enclave == true
    uses: ./.github/workflows/cd-syft-enclave.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  release-syft-bg:
    needs: [release-syft-rds]
    if: >-
      !cancelled() && !failure() &&
      inputs.release_syft_bg == true
    uses: ./.github/workflows/cd-syft-bg.yml
    with:
      bump_type: ${{ inputs.bump_type }}
    secrets: inherit

  deploy-syft:
    needs: [release-syft-bg, release-syft-enclave, release-syft-dataset]
    if: >-
      !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Upload to PyPI
        id: publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASS_SYFT }}
        run: |
          git pull
          just bump-and-publish ${{ inputs.bump_type }}
          VERSION=$(python3 syft/version.py)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # bump-and-publish already committed the version bump. Root tags continue
      # the repo's historical vX.Y.Z lineage; sub-packages use <name>/vX.Y.Z.
      # The tag is annotated and pushed explicitly: `--follow-tags` only pushes
      # annotated tags, so a lightweight tag would never reach origin.
      - name: Tag and push
        run: |
          git tag -a "v${{ env.VERSION }}" -m "syft v${{ env.VERSION }}"
          git push origin HEAD
          git push origin "refs/tags/v${{ env.VERSION }}"

  post-release-tests:
    needs: [deploy-syft]
    if: >-
      !cancelled() && !failure()
    uses: ./.github/workflows/post-release-tests.yml
    with:
      package_version: ${{ needs.deploy-syft.outputs.version }}
