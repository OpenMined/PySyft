name: 'Post-Release Tests'

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'syft version to test (e.g. 0.10.0)'
        type: string
        required: true
  workflow_call:
    inputs:
      package_version:
        type: string
        required: true

jobs:
  post-release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Poll PyPI for syft==${{ inputs.package_version }}
        run: |
          VERSION="${{ inputs.package_version }}"
          MAX_ATTEMPTS=15
          SLEEP=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/syft/${VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "syft==${VERSION} is available on PyPI"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: not yet available (HTTP $STATUS), waiting ${SLEEP}s..."
            sleep $SLEEP
          done
          echo "Timed out waiting for syft==${VERSION} on PyPI"
          exit 1

      - name: Wait for PyPI CDN propagation
        run: sleep 30

      - name: Smoke test the published packages in a clean venv
        run: |
          uv venv /tmp/pypi-check
          uv pip install --python /tmp/pypi-check/bin/python "syft==${{ inputs.package_version }}" syft-rds syft-bg
          /tmp/pypi-check/bin/python -c "import syft, syft_bg, syft_rds; assert syft.__version__ == '${{ inputs.package_version }}'; print('OK syft', syft.__version__)"

      - name: Run unit tests against the published wheel
        run: |
          uv sync --all-extras
          uv pip install --reinstall --no-deps "syft==${{ inputs.package_version }}"
          mv syft /tmp/syft-src  # the checkout would shadow the installed wheel
          uv run --no-sync pytest -n auto ./tests/unit

      - name: Run client migration tests against the published wheel
        run: uv run --no-sync pytest -n auto ./tests/migrations
